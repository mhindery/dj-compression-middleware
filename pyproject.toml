[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "dj_compression_middleware"
authors = [
    { name = "Mathieu Hinderyckx", email = "mathieu.hinderyckx@gmail.com" },
]
description = "Django middleware to compress responses with gzip, brotli and zstd."
version = "0.0.1.dev0"
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    'Framework :: Django',
    'Framework :: Django :: 5.1',
    'Framework :: Django :: 5.2',
    'Framework :: Django :: 6.0',
    'Framework :: Django :: 6.1',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware',
    'Topic :: Internet :: WWW/HTTP :: ASGI :: Middleware',
]
dependencies = [
    "brotli>=1.1.0 ; platform_python_implementation != 'PyPy'",
    "brotlipy>=0.7.0 ; platform_python_implementation == 'PyPy'",
    "django>=5.1",
    # Python 3.14+ provides `compression.zstd` in the standard library (PEP 784),
    # so the third-party package is only needed on older interpreters.
    "zstandard>=0.24.0 ; python_version < '3.14'",
]

[tool.setuptools_scm]
version_file = "src/dj_compression_middleware/_version.py"

[dependency-groups]
dev = ["ipdb>=0.13.13", "ipython>=8.18.1", "ruff>=0.16.9"]
tests = [
    "coverage>=7.14.0",
    "pytest>=9.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.7.1",
    "pytest-randomly>=5.0.0",
    "pytest-sugar>=1.0.0",
]

[tool.uv]
package = true
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

# ==== ruff ====
[tool.ruff]
line-length = 120
indent-width = 4
preview = false
required-version = ">=0.16.9"
target-version = "py312"
unsafe-fixes = true

# Overwritten in CI/CD
output-format = "full"
fix = true

[tool.ruff.lint]
preview = true
select = ["ALL"]

ignore = [
    "missing-copyright-notice",
    "undocumented-public-module",
    "suspicious-non-cryptographic-random-usage",
    "docstring-missing-returns",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["print"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
preview = false
line-ending = "auto"
indent-style = "space"
quote-style = "preserve"
docstring-code-format = true
docstring-code-line-length = "dynamic"
exclude = ["*.pyi", "**/migrations/*.py"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["module-import-not-at-top-of-file", "undocumented-public-package"]
"test*.py" = [
    "assert",
    "no-self-use",
    "undocumented-magic-method",
    "mutable-class-default",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "undocumented-public-init",
    "unused-function-argument",
    "missing-return-type-undocumented-public-function",
    "magic-value-comparison",
    "too-many-locals",
    "non-empty-init-module",
    "float-equality-comparison",
    "too-many-statements",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = false

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
force-wrap-aliases = false
detect-same-package = true
split-on-trailing-comma = false
known-local-folder = ["src"]
lines-after-imports = 2

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s --durations=5 -v --import-mode=importlib --cov --cov-report=term --cov-report=html --cov-report=xml --junit-xml=junit.xml"

junit_family = 'xunit2'
junit_suite_name = "test_suite"
junit_logging = 'all'
junit_log_passing_tests = true
junit_duration_report = "call"

# ==== Coverage ====
[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/media/*",
    ".venv/*",
    "terraform/*",
    "htmlcov/*",
    "staticfiles/*",
    "requirements/*",
    "manage.py",
    "asgi.py",
    "wsgi.py",
    "*/.vscode/*",
]
plugins = []
branch = true

[tool.coverage.report]
format = "text"
skip_empty = true
precision = 2

[tool.coverage.term]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
