[build-system]
requires = ["uv_build>=0.13.5"]
build-backend = "uv_build"

[project]
name = "dj_compression_middleware"
authors = [
    { name = "Mathieu Hinderyckx", email = "mathieu.hinderyckx@gmail.com" },
]
description = "Django middleware to compress responses with gzip, brotli and zstd."
version = "0.0.3"
readme = "README.md"
requires-python = ">=3.11,<3.16"
classifiers = [
    'Framework :: Django',
    'Framework :: Django :: 5.2',
    'Framework :: Django :: 6.0',
    'Framework :: Django :: 6.1',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware',
    'Topic :: Internet :: WWW/HTTP :: ASGI :: Middleware',
]
dependencies = [
    "brotli>=1.2.1 ; platform_python_implementation != 'PyPy'",
    "brotlicffi>=1.2.1.0 ; platform_python_implementation == 'PyPy'",
    "django>=5.2",
    "zstandard>=0.25.0",
]

[tool.setuptools_scm]
version_file = "src/dj_compression_middleware/_version.py"

[dependency-groups]
dev = ["ipdb>=0.13.13", "ipython>=8.18.1", "ruff>=0.17.2"]
tests = [
    "coverage>=7.5.3",
    "pytest>=9",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.8.0",
    "pytest-env>=1.1.5",
    "pytest-randomly>=3.15.0",
    "pytest-sugar>=1.0.0",
]

[tool.uv]
package = true
cache-keys = [{ file = "pyproject.toml" }]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

# ==== ruff ====
[tool.ruff]
line-length = 120
extend-include = ["*.ipynb"]
indent-width = 4
preview = false
target-version = "py311"
unsafe-fixes = true

# Overwritten in CI/CD
output-format = "full"
fix = true

[tool.ruff.lint]
preview = true
select = [
    "ALL"
]

ignore = [
    "missing-copyright-notice",
    "undocumented-public-module",
    "legacy-type-comment",
    "complex-structure",
    "docstring-missing-returns",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["print"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
preview = false
line-ending = "auto"
indent-style = "space"
quote-style = "preserve"
docstring-code-format = true
docstring-code-line-length = "dynamic"
exclude = ["*.pyi", "**/migrations/*.py"]

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = true

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["module-import-not-at-top-of-file", "undocumented-public-package"]
"**/{tests,docs,tools}/*" = [
    "module-import-not-at-top-of-file",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "undocumented-public-init",
    "unused-function-argument",
    "missing-return-type-undocumented-public-function",
    "magic-value-comparison",
    "too-many-locals",
    "too-many-statements",
    "assert",
    "mutable-class-default",
    "suspicious-non-cryptographic-random-usage",
    "no-self-use",
    "undocumented-magic-method",
    "non-empty-init-module",
]
"test*.py" = [
    "module-import-not-at-top-of-file",
    "undocumented-public-class",
    "undocumented-public-function",
    "missing-return-type-undocumented-public-function",
    "unused-function-argument",
    "magic-value-comparison",
    "too-many-locals",
    "too-many-statements",
    "assert",
    "mutable-class-default",
    "suspicious-non-cryptographic-random-usage",
    "no-self-use",
    "undocumented-magic-method",
]
# Django-specific rules
"**/migrations/*.py" = ["I", "D", "mutable-class-default", "ambiguous-unicode-character-string"]
"**/factories.py" = ["undocumented-public-nested-class", "undocumented-public-class"]
"**/management/commands/*.py" = ["undocumented-public-class"]
"apps.py" = ["undocumented-public-class", "undocumented-public-method", "import-outside-top-level", "unused-import"]
"admin.py" = ["undocumented-public-class", "undocumented-public-function", "undocumented-public-method", "mutable-class-default", "unused-method-argument"]
"**/*views.py" = ["unused-method-argument"]
"forms.py" = ["undocumented-public-class", "mutable-class-default"]
"**/api/serializers.py" = ["undocumented-public-class"]

[tool.ruff.lint.pylint]
max-args = 20
max-positional-args = 20

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = true     # allows for gradual typing
suppress-none-returning = false

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
force-wrap-aliases = false
detect-same-package = true
split-on-trailing-comma = false
known-local-folder = ["src"]
lines-after-imports = 2

# ==== pytest ====
[tool.pytest_env]
ENVIRONMENT = "test"

[tool.pytest]
color = "yes"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s --durations=5 -v --import-mode=importlib --cov --cov-report=term --cov-report=html --cov-report=xml --junit-xml=junit.xml"
python_files = ["tests/tests.py", "tests/test_*.py"]

junit_family = 'xunit2'
junit_suite_name = "test_suite"
junit_logging = 'all'
junit_log_passing_tests = true
junit_duration_report = "call"

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==== Coverage ====
[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/media/*",
    ".venv/*",
    "terraform/*",
    "htmlcov/*",
    "staticfiles/*",
    "requirements/*",
    "manage.py",
    "asgi.py",
    "wsgi.py",
    "*/.vscode/*",
]
plugins = []
branch = true

[tool.coverage.report]
format = "text"
skip_empty = true
precision = 2

[tool.coverage.term]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
